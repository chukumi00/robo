<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>물품 등록 | AI SMART WAREHOUSE</title><style>:root{--bg:#0b111e;--panel:#131b2e;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,#172b40 0,var(--bg) 42%);color:var(--text);font:13px "Segoe UI",sans-serif}.panel{width:min(100%,520px);padding:30px;background:rgba(19,27,46,.96);border:1px solid var(--border);border-radius:6px;box-shadow:0 18px 50px #0004}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:1.5px;font-weight:700}h1{margin:8px 0 5px;font-size:22px}.muted,label{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:17px}label{display:block;margin-bottom:7px;font-size:11px}input,select{width:100%;padding:10px;border:1px solid #263a52;border-radius:4px;background:#0d1a2b;color:var(--text)}.actions{display:flex;gap:8px;margin-top:24px}button,a{flex:1;border:0;border-radius:4px;padding:10px;background:#0284c7;color:#fff;text-align:center;text-decoration:none;font-weight:600;cursor:pointer}a{background:#1e293b;color:var(--muted)}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="panel"><div class="eyebrow">AI SMART WAREHOUSE / ITEM MASTER</div><h1>{% if item %}물품 수정{% else %}물품 등록{% endif %}</h1><div class="muted">물품 기본정보와 재고 정보를 입력합니다.</div><form method="post">{% csrf_token %}<div class="field"><label for="name">물품명</label><input id="name" name="name" value="{{ item.name|default:'' }}" required></div><div class="grid"><div class="field"><label for="item_class">물품분류</label><input id="item_class" name="item_class" type="number" value="{{ item.item_class|default:1 }}" required></div><div class="field"><label for="incoming_date">입고일</label><input id="incoming_date" name="incoming_date" type="datetime-local" value="{{ item.incoming_date|date:'Y-m-d\\TH:i' }}" required></div></div><div class="grid"><div class="field"><label for="width">규격 너비</label><input id="width" name="width" type="number" step="0.01" value="{{ item.width|default:0 }}" required></div><div class="field"><label for="length">규격 길이</label><input id="length" name="length" type="number" step="0.01" value="{{ item.length|default:0 }}" required></div></div><div class="grid"><div class="field"><label for="height">규격 높이</label><input id="height" name="height" type="number" step="0.01" value="{{ item.height|default:0 }}" required></div><div class="field"><label for="location_id">보관 위치</label><select id="location_id" name="location_id" required><option value="">선택</option>{% for location in locations %}<option value="{{ location.location_id }}" {% if item.location_id == location.location_id %}selected{% endif %}>{{ location.zone.name }} / {{ location.location_code }}</option>{% endfor %}</select></div></div><div class="grid"><div class="field"><label for="cur_item_num">현재재고량</label><input id="cur_item_num" name="cur_item_num" type="number" min="0" value="{{ inventory.cur_item_num|default:0 }}" required></div><div class="field"><label for="min_item_num">최소재고량</label><input id="min_item_num" name="min_item_num" type="number" min="0" value="{{ inventory.min_item_num|default:0 }}" required></div></div><div class="actions"><button type="submit">저장</button><a href="{% url 'robotapp:item_list' %}">취소</a></div></form></main></body></html>
