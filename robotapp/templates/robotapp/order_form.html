<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>주문 등록 | AI SMART WAREHOUSE</title>
  <style>:root{--bg:#0b111e;--panel:#131b2e;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,#172b40 0,var(--bg) 42%);color:var(--text);font:13px "Segoe UI",sans-serif}.panel{width:min(100%,430px);padding:30px;background:rgba(19,27,46,.96);border:1px solid var(--border);border-radius:6px;box-shadow:0 18px 50px #0004}h1{margin:8px 0 5px;font-size:22px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:1.5px;font-weight:700}.muted,label{color:var(--muted);font-size:12px}.field{margin-top:18px}label{display:block;margin-bottom:7px;font-size:11px}input,select{width:100%;padding:11px 12px;border:1px solid #263a52;border-radius:4px;background:#0d1a2b;color:var(--text)}.actions{display:flex;gap:8px;margin-top:22px}button,a{flex:1;padding:10px;border:0;border-radius:4px;background:#0284c7;color:#fff;text-align:center;text-decoration:none;font-weight:600}a{background:#1e293b;color:var(--muted)}</style>
</head>
<body><main class="panel"><div class="eyebrow">AI SMART WAREHOUSE / ORDER</div><h1>{% if order_type == 1 %}입고{% else %}출고{% endif %} 등록</h1><div class="muted">새로운 입출고 주문을 등록합니다.</div>{% if error %}<p style="color:#ef4444">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<div class="field"><label for="item_id">물품</label><select id="item_id" name="item_id" required><option value="">물품 선택</option>{% for item in items %}<option value="{{ item.item_id }}">{{ item.name }}</option>{% endfor %}</select></div><div class="field"><label for="destination_id">작업 목적지</label><select id="destination_id" name="destination_id" required><option value="">사용 가능한 위치 선택</option>{% for destination in destinations %}<option value="{{ destination.location_id }}">{{ destination.zone.name }} / {{ destination.location_code }}</option>{% endfor %}</select></div><div class="field"><label for="quantity">수량</label><input id="quantity" name="quantity" type="number" min="1" required></div><div class="field"><label for="due_time">마감일시</label><input id="due_time" name="due_time" type="datetime-local" required></div><div class="field"><label for="priority">주문타입</label><select id="priority" name="priority" required><option value="1">일반</option><option value="2">긴급</option></select></div><div class="actions"><button type="submit">등록</button><a href="{% url 'robotapp:inventory' %}">취소</a></div></form></main></body>
</html>
