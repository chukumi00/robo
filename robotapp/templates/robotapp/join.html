<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 | AI SMART WAREHOUSE</title>
  <style>
    :root { --bg:#0b111e; --panel:#131b2e; --border:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --blue:#38bdf8; --green:#22c55e; --red:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 0%, #172b40 0, var(--bg) 42%); color:var(--text); font:13px "Segoe UI", sans-serif; }
    .panel { width:min(100%, 430px); padding:28px; background:rgba(19,27,46,.96); border:1px solid var(--border); border-radius:6px; box-shadow:0 18px 50px rgba(0,0,0,.3); }
    .eyebrow { color:var(--blue); font-size:10px; letter-spacing:1.5px; font-weight:700; }
    h1 { margin:7px 0 5px; font-size:22px; } .subtitle { color:var(--muted); font-size:12px; }
    .field { margin-top:16px; } label { display:block; margin-bottom:7px; color:var(--muted); font-size:11px; }
    input { width:100%; padding:11px 12px; border:1px solid #263a52; border-radius:4px; background:#0d1a2b; color:var(--text); outline:none; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(56,189,248,.12); }
    .email-row, .actions { display:flex; gap:8px; } .email-row input { min-width:0; }
    button, a { border:0; border-radius:4px; padding:10px 14px; color:#fff; background:#0284c7; font:600 12px "Segoe UI", sans-serif; cursor:pointer; text-decoration:none; text-align:center; }
    .email-row button { flex:none; padding-inline:12px; font-size:11px; } button:hover, a:hover { background:#0ea5e9; }
    .submit { width:100%; margin-top:22px; } .message { min-height:18px; margin-top:8px; font-size:11px; }
    .error { margin:0 0 12px; color:var(--red); } .footer-link { display:block; margin-top:18px; color:var(--muted); font-size:11px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="eyebrow">AI SMART WAREHOUSE</div><h1>관리자 회원가입</h1><div class="subtitle">관제 시스템에 사용할 계정을 등록합니다.</div>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><label for="email">이메일</label><div class="email-row"><input type="email" id="email" name="email" placeholder="admin@example.com" required><button type="button" onclick="checkEmailAjax()">중복확인</button></div><div id="msg" class="message"></div></div>
      <div class="field"><label for="name">이름</label><input type="text" id="name" name="name" required></div>
      <div class="field"><label for="password">비밀번호</label><input type="password" id="password" name="password" required></div>
      <div class="field"><label for="phone">전화번호</label><input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required></div>
      <button class="submit" type="submit">계정 생성</button>
    </form>
    <a class="footer-link" href="{% url 'robotapp:login' %}">이미 계정이 있나요? 로그인</a>
  </main>
  <script>
    function checkEmailAjax() {
      const email = document.getElementById('email').value;
      const message = document.getElementById('msg');
      if (!email) { message.textContent = '이메일을 먼저 입력해주세요.'; message.style.color = 'var(--red)'; return; }
      fetch(`../check_email/?email=${encodeURIComponent(email)}`).then(response => response.json()).then(data => { message.textContent = data.is_exists ? '이미 사용 중인 이메일입니다.' : '사용 가능한 이메일입니다.'; message.style.color = data.is_exists ? 'var(--red)' : 'var(--green)'; });
    }
  </script>
</body>
</html>
