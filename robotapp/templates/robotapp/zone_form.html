<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>구역 등록 | AI SMART WAREHOUSE</title><style>:root{--bg:#0b111e;--panel:#131b2e;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,#172b40 0,var(--bg) 42%);color:var(--text);font:13px "Segoe UI",sans-serif}.panel{width:min(100%,560px);padding:30px;background:rgba(19,27,46,.96);border:1px solid var(--border);border-radius:6px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:1.5px;font-weight:700}h1{margin:8px 0 5px;font-size:22px}.muted,label{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:17px}label{display:block;margin-bottom:7px;font-size:11px}input,select{width:100%;padding:10px;border:1px solid #263a52;border-radius:4px;background:#0d1a2b;color:var(--text)}.actions{display:flex;gap:8px;margin-top:24px}button,a{flex:1;border:0;border-radius:4px;padding:10px;background:#0284c7;color:#fff;text-align:center;text-decoration:none;font-weight:600;cursor:pointer}a{background:#1e293b;color:var(--muted)}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="panel"><div class="eyebrow">AI SMART WAREHOUSE / ZONE MASTER</div><h1>{% if zone %}구역 수정{% else %}구역 등록{% endif %}</h1><div class="muted">구역의 기본정보와 규모를 입력합니다.</div><form method="post">{% csrf_token %}<div class="field"><label for="name">구역명</label><input id="name" name="name" value="{{ zone.name|default:'' }}" required></div><div class="grid"><div class="field"><label for="state">사용 가능 여부</label><select id="state" name="state"><option value="0" {% if zone.state == 0 %}selected{% endif %}>사용 가능</option><option value="1" {% if zone.state == 1 %}selected{% endif %}>사용 불가</option></select></div><div class="field"><label for="org_x">원점 X</label><input id="org_x" name="org_x" type="number" step="0.01" value="{{ zone.org_x|default:0 }}" required></div></div><div class="grid"><div class="field"><label for="org_y">원점 Y</label><input id="org_y" name="org_y" type="number" step="0.01" value="{{ zone.org_y|default:0 }}" required></div><div class="field"><label for="org_z">원점 Z</label><input id="org_z" name="org_z" type="number" step="0.01" value="{{ zone.org_z|default:0 }}" required></div></div><div class="grid"><div class="field"><label for="width">너비</label><input id="width" name="width" type="number" step="0.01" required value="{{ zone.width|default:0 }}"></div><div class="field"><label for="length">길이</label><input id="length" name="length" type="number" step="0.01" required value="{{ zone.length|default:0 }}"></div></div><div class="field"><label for="height">높이</label><input id="height" name="height" type="number" step="0.01" required value="{{ zone.height|default:0 }}"></div><div class="actions"><button type="submit">저장</button><a href="{% url 'robotapp:zone_list' %}">취소</a></div></form></main></body></html>
