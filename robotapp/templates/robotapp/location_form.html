<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>보관 위치 등록 | AI SMART WAREHOUSE</title><style>:root{--bg:#0b111e;--panel:#131b2e;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--blue:#38bdf8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,#172b40 0,var(--bg) 42%);color:var(--text);font:13px "Segoe UI",sans-serif}.panel{width:min(100%,560px);padding:30px;background:rgba(19,27,46,.96);border:1px solid var(--border);border-radius:6px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:1.5px;font-weight:700}h1{margin:8px 0 5px;font-size:22px}.muted,label{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:17px}label{display:block;margin-bottom:7px;font-size:11px}input,select{width:100%;padding:10px;border:1px solid #263a52;border-radius:4px;background:#0d1a2b;color:var(--text)}.actions{display:flex;gap:8px;margin-top:24px}button,a{flex:1;border:0;border-radius:4px;padding:10px;background:#0284c7;color:#fff;text-align:center;text-decoration:none;font-weight:600;cursor:pointer}a{background:#1e293b;color:var(--muted)}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="panel"><div class="eyebrow">AI SMART WAREHOUSE / LOCATION MASTER</div><h1>{% if location %}보관 위치 수정{% else %}보관 위치 등록{% endif %}</h1><div class="muted">위치좌표와 보관량, 소속 구역을 입력합니다.</div><form method="post">{% csrf_token %}<div class="grid"><div class="field"><label for="location_code">위치번호</label><input id="location_code" name="location_code" type="number" value="{{ location.location_code|default:'' }}" required></div><div class="field"><label for="zone_id">소속 구역</label><select id="zone_id" name="zone_id" required><option value="">선택</option>{% for zone in zones %}<option value="{{ zone.zone_id }}" {% if location.zone_id == zone.zone_id %}selected{% endif %}>{{ zone.name }}</option>{% endfor %}</select></div></div><div class="grid"><div class="field"><label for="x_coord">X 좌표</label><input id="x_coord" name="x_coord" type="number" step="0.01" required value="{{ location.x_coord|default:0 }}"></div><div class="field"><label for="y_coord">Y 좌표</label><input id="y_coord" name="y_coord" type="number" step="0.01" required value="{{ location.y_coord|default:0 }}"></div></div><div class="grid"><div class="field"><label for="z_coord">Z 좌표</label><input id="z_coord" name="z_coord" type="number" step="0.01" required value="{{ location.z_coord|default:0 }}"></div><div class="field"><label for="state">사용 가능 여부</label><select id="state" name="state"><option value="0" {% if location.state == 0 %}selected{% endif %}>사용 가능</option><option value="1" {% if location.state == 1 %}selected{% endif %}>사용 불가</option></select></div></div><div class="grid"><div class="field"><label for="max_storage">최대보관량</label><input id="max_storage" name="max_storage" type="number" step="0.01" required value="{{ location.max_storage|default:0 }}"></div><div class="field"><label for="cur_storage">현재보관량</label><input id="cur_storage" name="cur_storage" type="number" step="0.01" required value="{{ location.cur_storage|default:0 }}"></div></div><div class="actions"><button type="submit">저장</button><a href="{% url 'robotapp:location_list' %}">취소</a></div></form></main></body></html>
