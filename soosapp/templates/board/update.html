<!DOCTYPE html>
<html>
<head>
	<title> Django Board </title>
	<meta charset="utf-8">
	<style>
		a{text-decoration:none}
	</style>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
	<script>
	    function f(){
	    	input.email.value = "";
	    	input.subject.value = "";
	    	//input.content.innerText = "";
	    	$("#ta").text("");
	    	
	    	input.email.focus();
	    }

		function uploadFile(){
			location.href="../upload/{{board.id}}";
		}
	</script>
</head>
<body>
<center>
<font color='gray' size='4' face='휴먼편지체'>
<hr width='600' size='2' color='gray' noshade>
<h3> Django Board</h3>
</font>
<font color='gray' size='4' face='휴먼편지체'>
<a href='../list'>목록</a>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
<a href='../write'>글쓰기</a><br/>
</font>
<hr width='600' size='2' color='gray' noshade>
</center>

<form name='input' method='post' action='update_ok/{{board.id}}'>
{% csrf_token %}
<input type="hidden" name="seq" value="{{board.id}}">
<table border='0' width='600' align='center' cellpadding='3' cellspacing='1' bordercolor='gray'>	
<tr>
   <td width='20%' align='center' >WRITER</td>
   <td>
      <input name='writer' readonly value={{board.b_writer}}>
   </td>
</tr>

<tr>
	<td align='center'>EMAIL</td>
	<td><input name='email' value={{board.b_email}}></td>
</tr>

<tr>
	<td align='center'>SUBJECT</td>
	<td><input name='subject' value={{board.b_subject}}></td>
</tr>
			
<tr>
	<td align='center'>CONTENT</td>
	<td><textarea id='ta' name='content' rows='15' cols='70'>{{board.b_contents}}</textarea></td>
</tr>
<tr>	
	<td align='center'>파일</td>
	<td>{{board.b_file}}</td>	
</tr>
<tr>
	 <td colspan='2' align='center'>
		<input type='submit' value='수정'>
		<input type="button" value="다시입력" onclick="f()">
		<input type="button" value="파일업로드" onclick="uploadFile()">
	 </td>
</tr>
</table>
<hr width="600" size="2" color="gray" noshade>
</form>
</body>
</html>
