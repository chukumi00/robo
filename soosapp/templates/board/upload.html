#upload.html
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>File Upload with Django</title>
	<style>
		a { text-decoration:none }
	</style>
	<script>
		function check(){
			const f = document.f;
			if(f.elements['title'].value.trim() == ''){
				alert('제목을 입력하세요');
				f.elements['title'].focus();
				return;
			}
			if(f.elements['file'].value == ''){
				alert('파일을 선택하세요');
				return;
			}
			f.submit();
		}
	</script>
</head>
<body>
<center>
	<h1>File Upload</h1>
	<a href='../list'>홈</a>
	<hr width='500'>

    <!-- #enctype='multipart/form-data' 의미? 이 폼에 파일이 들어 있으니 바이너리로 쪼개서 담아 보내라!! -->
	<form name='f' action='upload_ok/{{ board.id }}' method='post' enctype='multipart/form-data'>
		{% csrf_token %}
		<table border='1' width='500'>
			<tr>
				<td width='100'>Subject</td>
				<td><input type='text' name='title' size='40' value="{{ board.b_subject }}"></td>
				<!-- <td><input name='subject' value={{subject}}></td> -->
			</tr>
			<tr>
				<td>파일</td>
				<td><input type='file' name='file'></td>
			</tr>
			<tr>
				<td colspan='2' align='center'>
					<input type='button' value='업 로 드' onclick='check()'>
				</td>
			</tr>
		</table>
	</form>
	<br/>
	<font size='2' color='gray'>허용: jpg, png, gif, pdf, txt, csv, xlsx, zip / 5MB 이하</font>
</center>
</body>
</html>
