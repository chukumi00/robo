<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>회원가입 - Ajax 테스트</title>
</head>
<body>
	<center>
		<h2>회원가입 (Ajax 중복확인)</h2>
		<form action="" method="post">
			{% csrf_token %}
			<table>
				<tr>
					<td>이메일:</td>
					<td>
						<input type="email" id="email" name="email" placeholder="abc@hanmail.net">
						<button type="button" onclick="checkEmailAjax()">중복확인</button>
					</td>					
				</tr>
				<tr>
					<td colspan="2">
						<!-- Ajax 결과를 보여줄 영역 -->
						<span id="msg" style="font-size: 12px;"></span>
					</td>
				</tr>
			</table>
		</form>
	</center>

	<script>
		function checkEmailAjax() {
			const emailValue = document.getElementById("email").value;
			const msgArea = document.getElementById("msg");

			if (!emailValue) {
				alert("이메일을 입력해주세요.");
				return;
			}

			// 비동기 통신 (fetch API)
			fetch(`../check_email/?email=${encodeURIComponent(emailValue)}`)
				.then(response => response.json())
				.then(data => {
					if (data.is_exists) {
						msgArea.style.color = "red";
						msgArea.innerText = "이미 사용 중인 이메일!";
					} else {
						msgArea.style.color = "green";
						msgArea.innerText = "사용 가능한 이메일!";
					}
				})
				.catch(error => {
					console.error("Error:", error);
				});
		}
	</script>
</body>
</html>
