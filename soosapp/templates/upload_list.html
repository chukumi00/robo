<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Upload List</title>
	<style>
		a { text-decoration:none }
		td { font-size:14px }
		.thumb { max-width:80px; max-height:60px; }
	</style>
	<script>
		function del(id, name){
			if(confirm(name + '\n\n삭제하시겠습니까?')){
				location.href = '../delete/' + id + '/';
			}
		}
	</script>
</head>
<body>
<center>
	<h1>업로드 목록</h1>
	<a href='../../'>홈</a> &nbsp;&nbsp;&nbsp; <a href='../'>파일 올리기</a>
	<hr width='800'>

	<table border='1' width='800'>
		<tr bgcolor='#eeeeee' align='center'>
			<td width='50'>번호</td>
			<td>제목 / 파일명</td>
			<td width='90'>크기</td>
			<td width='130'>등록일</td>
			<td width='60'>삭제</td>
		</tr>
		{% for row in rows %}
		<tr>
			<td align='center'>{{ row.id }}</td>
			<td>
				{{ row.title }}<br/>
				<a href='{{ row.file.url }}' download='{{ row.orgfile }}'>{{ row.orgfile }}</a>
			</td>
			<td align='right'>{{ row.filesize|filesizeformat }}&nbsp;</td>
			<td align='center'>{{ row.rdate|date:"Y-m-d H:i" }}</td>
			<td align='center'>
				<a href="javascript:del({{ row.id }}, '{{ row.orgfile|escapejs }}')">삭제</a>
			</td>
		</tr>
		{% empty %}
		<tr><td colspan='6' align='center'>등록된 파일이 없습니다</td></tr>
		{% endfor %}
	</table>
</center>
</body>
</html>
